# Nginx untuk SIAGA. Salin ke /etc/nginx/sites-available/siaga.conf, ganti
# siaga.example.id, lalu: ln -s ../sites-available/siaga.conf /etc/nginx/sites-enabled/
# Sertifikat: certbot --nginx -d siaga.example.id

upstream siaga_web { server 127.0.0.1:3000; keepalive 16; }
upstream siaga_api { server 127.0.0.1:4000; keepalive 16; }

# Batas per IP sengaja longgar karena CGNAT operator seluler (banyak pengguna satu IP).
limit_req_zone $binary_remote_addr zone=siaga_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=siaga_upload:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name siaga.example.id;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Bentuk "ssl http2" agar jalan di Nginx 1.24 (Ubuntu 24.04). Di Nginx >= 1.25 boleh diganti "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name siaga.example.id;

    ssl_certificate     /etc/letsencrypt/live/siaga.example.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siaga.example.id/privkey.pem;

    # Foto laporan maks 8 MB (lihat LIMITS di apps/server/src/services/reports.ts)
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API Fastify: /api/status → http://127.0.0.1:4000/status
    location /api/ {
        limit_req zone=siaga_api burst=100 nodelay;
        proxy_pass http://siaga_api/;
        proxy_read_timeout 30s;
    }
    location = /api/reports {
        limit_req zone=siaga_upload burst=10 nodelay;
        proxy_pass http://siaga_api/reports;
        proxy_read_timeout 60s;
    }

    # Foto laporan (STORAGE_DRIVER=local). Nama berkas acak (UUID).
    location /photos/ {
        alias /var/lib/siaga/photos/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Antrean moderasi: opsional, batasi ke IP kantor
    # location /moderasi { allow 203.0.113.10; deny all; proxy_pass http://siaga_web; }

    # Next.js sudah mengirim Cache-Control: no-cache untuk service worker
    location = /sw.js {
        proxy_pass http://siaga_web;
    }
    location /_next/static/ {
        proxy_pass http://siaga_web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://siaga_web;
    }
}
