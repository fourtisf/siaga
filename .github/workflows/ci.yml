name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: siaga
          POSTGRES_PASSWORD: siaga
          POSTGRES_DB: siaga
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U siaga" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://siaga:siaga@localhost:5432/siaga
      REDIS_URL: redis://localhost:6379/0
      IP_HASH_SALT: ci-salt-not-secret
      ADMIN_TOKEN: ci-admin-token-not-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @siaga/core build
      - run: pnpm --filter @siaga/server db:generate
      - run: pnpm --filter @siaga/server db:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: SIAGA_IT=1 pnpm --filter @siaga/server test
      - run: pnpm build
